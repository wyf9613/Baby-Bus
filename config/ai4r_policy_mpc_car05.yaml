# Overlay: joint MPC on car 05 (10.43.254.18), 2026-10-15. A fixed-request straight
# start was tested on this car; most model parameters remain cross-car substitutions.
# Layer order:
#   ai4r_policy.yaml -> ai4r_policy_newcar27.yaml -> ai4r_policy_mpc_newcar27.yaml
#   -> ai4r_policy_mpc_centerline.yaml -> this file
#
# 2026-10-18: cap 0.15 with a soft overspeed (drive cut above 0.20, lock only if it does not
# come back within 1 s or exceeds 0.40 for 0.2 s), longer start timeout, more restarts and a
# 60 s run budget, so that the MPC is not stopped where the MVP would keep driving.
#
# What is and isn't actually measured for car 05:
#   - Deadband: 0.30, bracketed by two car 05 execs. 17:53 (car05-v2-startfix-exec-20261015-175338):
#     at .27's 0.289 (applied ~0.256) car 05 decelerated from 0.18 to 0.06 m/s. 18:18
#     (car05-v2-db032-exec-20261015-181825): at 0.32 the moving lower bound (deadband+bias
#     ~0.318) kept car 05 accelerating to 0.20 m/s and both runs stopped on overspeed while
#     the model predicted ~0.12 m/s. Midpoint, not identified.
#   - Motor_gain/drag/braking: still car .27's 10-06 log fit; not identified
#     on 05. Fixed request 0.35 was tested on 05 at 17:06: reported applied 0.324,
#     first wheel speed >0.05 at ~0.79 s, speed guard returned zero at ~0.17 m/s.
#     This supports the start request only, not a validated 0.12 m/s tracking model.
#   - Steering gain/offset/limits/rate: car .20's 2026-10-12 protractor measurement
#     (offline/vehicle_identification/vehicle_params.py steering_gain_rad=-0.3142,
#     i.e. 18 deg at full deflection, positive request turns right), NOT measured on 05.
#   - Geometry (wheelbase/body extents): the course placeholder, which happens to equal
#     .20's own measured geometry -- the one piece of overlap across the two substitutions.
# valid: true still admits an incomplete, cross-car model by the on-site decision;
# the single start trial does not qualify steering, geometry or longitudinal tracking.
/**/ai4r_policy:
  ros__parameters:
    vehicle:
      valid: true
      source: "car05_20261015_start035_db030_27model_20steering_UNVERIFIED"
      drive_breakaway: 0.35          # tested fixed request on THIS car; not applied telemetry
      drive_max: 0.35                # preserve the previous hard request ceiling
      drive_deadband: 0.24           # 2026-10-19 (fresh battery): request 0.25 held ~0.255 m/s, 0.28 -> 0.24, 0.30 -> 0.27;
                                     # 0.30 left the MPC coasting at 0.25 above the soft line (bias pinned at -0.05).
                                     # Was 0.30 (10-15: 0.289 sagged, 0.32 overspeeds); bias +/-0.05 still covers 0.19-0.29
      steering_gain_rad: -0.3142       # car .20, 2026-10-12 protractor measurement
      steering_offset_rad: 0.0         # not measured on either car; assumed centred
      steering_min_rad: -0.3142
      steering_max_rad: 0.3142
      steering_rate_limit_rad_s: 1.21
      steering_delay_s: 0.03
    mpc:
      # shadow/exec itself is still set by --mode (mpc-shadow-centerline vs
      # mpc-exec-centerline), not here: this overlay also applies in shadow mode.
      # 2026-10-18 relaxations so MPC runs where the MVP runs (docs/MPC_PROGRESS_LOG.md):
      v_exec_max_mps: 0.20            # ceiling; make_deploy_yaml --v-exec-max picks 0.15 or 0.20 below it.
                                       # Was 0.12 (deadband edge: 17:53 sagged, 18:18 overshot), then 0.15;
                                       # the MVP runs this car at 0.20, and the 2026-10-19 lattice Gym sweep
                                       # found 0.20 the best cap. Only with the soft overspeed below, never
                                       # with the old 0.10 lock alone.
      overspeed_margin_mps: 0.10      # unused while the soft margin is > 0 (old lock: 0.22 m/s)
      overspeed_soft_margin_mps: 0.05 # above 0.20 m/s the QP may cut drive below the deadband
      overspeed_cut_margin_mps: 0.03  # above 0.23 m/s drive is forced to 0
      overspeed_cut_timeout_s: 2.0    # lock if still above cap+soft after 2 s (was 1 s; 10-19 locks: model/battery drift, held wheel readings)
      overspeed_hard_mps: 0.40        # or above 0.40 m/s for 0.2 s (0.35 drive cap, ~0.5 m/s steady)
      overspeed_hard_persist_s: 0.2
      breakaway_ramp_per_s: 0.0      # start at the tested request; do not slowly ramp from 0.30
      breakaway_timeout_s: 2.5       # was 1.5: fixed 0.35 produced feedback at ~0.79 s; margin for a low battery
      max_restarts: 5                # was 3
      restart_count_reset_s: 10.0    # 10 s of tracking clears the count (long / loop runs)
      moving_speed_mps: 0.05         # unchanged: keep the existing tracking handover threshold
    control:
      max_run_time_s: 60.0           # was 30; the distance budget comes from make_deploy_yaml --distance
