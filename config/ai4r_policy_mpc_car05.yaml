# Overlay: joint MPC on car 05 (10.43.254.18), 2026-10-15. A fixed-request straight
# start was tested on this car; most model parameters remain cross-car substitutions.
# Layer order:
#   ai4r_policy.yaml -> ai4r_policy_newcar27.yaml -> ai4r_policy_mpc_newcar27.yaml
#   -> ai4r_policy_mpc_centerline.yaml -> this file
#
# 2026-10-18: cap 0.15 with a soft overspeed (drive cut above 0.20, lock only if it does not
# come back within 1 s or exceeds 0.40 for 0.2 s), longer start timeout, more restarts and a
# 60 s run budget, so that the MPC is not stopped where the MVP would keep driving.
#
# What is and isn't actually measured for car 05:
#   - Deadband: 0.30, bracketed by two car 05 execs. 17:53 (car05-v2-startfix-exec-20261015-175338):
#     at .27's 0.289 (applied ~0.256) car 05 decelerated from 0.18 to 0.06 m/s. 18:18
#     (car05-v2-db032-exec-20261015-181825): at 0.32 the moving lower bound (deadband+bias
#     ~0.318) kept car 05 accelerating to 0.20 m/s and both runs stopped on overspeed while
#     the model predicted ~0.12 m/s. Midpoint, not identified.
#   - Motor_gain/drag/braking: still car .27's 10-06 log fit; not identified
#     on 05. Fixed request 0.35 was tested on 05 at 17:06: reported applied 0.324,
#     first wheel speed >0.05 at ~0.79 s, speed guard returned zero at ~0.17 m/s.
#     This supports the start request only, not a validated 0.12 m/s tracking model.
#   - Steering gain/limits: car 05's own driving on 2026-10-19 (curvature from IMU yaw rate
#     over wheel speed, 4 bags): 23-25 deg at full deflection on both sides; -0.37 rad is a
#     midpoint with car .20's -0.3142 (sign kept from it). Offset and rate still .20's.
#   - Geometry (wheelbase/body extents): the course placeholder, which happens to equal
#     .20's own measured geometry -- the one piece of overlap across the two substitutions.
# valid: true still admits an incomplete, cross-car model by the on-site decision;
# the single start trial does not qualify steering, geometry or longitudinal tracking.
/**/ai4r_policy:
  ros__parameters:
    vehicle:
      valid: true
      source: "car05_20261019_start035_db025_27model_05steering_UNVERIFIED"
      drive_breakaway: 0.35          # tested fixed request on THIS car; not applied telemetry
      drive_max: 0.38                # below mpc.high_speed_mps only; 0.35 above it (mpc.high_speed_drive_max).
                                     # 0.40 on a fresh battery (18:45) shot from 0.09 to 0.47 m/s out of a hairpin.
                                     # 10-19 18:24 (used battery): 0.35 did not start the car in 2.5 s and
                                     # 0.28-0.31 stalled it in moderate turns. A flat 0.40 overshot to 0.56 m/s
                                     # out of U-turns on a fresh-battery Gym plant, hence the speed split
      drive_deadband: 0.25           # middle of the battery range, with mpc.drive_bias_max 0.10 covering 0.15-0.35:
                                     # fresh (16:50) a 0.25 request held ~0.255 m/s and 0.30 left the MPC coasting
                                     # above the soft line (bias at -0.05); used (17:55) the bias sat at +0.05 on
                                     # 0.24 and the car stalled in turns. Was 0.30, then 0.24
      steering_gain_rad: -0.37         # car 05 driving, 2026-10-19 (4 bags, IMU yaw / wheel speed): full lock
                                       # 23-25 deg (0.42 rad) both sides, 23-29 deg per unit below it. Was -0.3142
                                       # (car .20 protractor, 18 deg): the MPC over-steered and reversed lock.
                                       # 21 deg is a midpoint: on a 24 deg Gym plant 0.37 gave the smallest
                                       # U-turn error without 0.42's 0.52 m right-angle excursion
      steering_offset_rad: 0.0         # measured within +/-2 deg, sign varying between bags
      steering_min_rad: -0.37
      steering_max_rad: 0.37
      steering_rate_limit_rad_s: 1.21
      steering_delay_s: 0.03
    mpc:
      # shadow/exec itself is still set by --mode (mpc-shadow-centerline vs
      # mpc-exec-centerline), not here: this overlay also applies in shadow mode.
      # 2026-10-18 relaxations so MPC runs where the MVP runs (docs/MPC_PROGRESS_LOG.md):
      v_exec_max_mps: 0.20            # ceiling; make_deploy_yaml --v-exec-max picks 0.15 or 0.20 below it.
                                       # Was 0.12 (deadband edge: 17:53 sagged, 18:18 overshot), then 0.15;
                                       # the MVP runs this car at 0.20, and the 2026-10-19 lattice Gym sweep
                                       # found 0.20 the best cap. Only with the soft overspeed below, never
                                       # with the old 0.10 lock alone.
      overspeed_margin_mps: 0.10      # unused while the soft margin is > 0 (old lock: 0.22 m/s)
      overspeed_soft_margin_mps: 0.05 # above 0.20 m/s the QP may cut drive below the deadband
      overspeed_cut_margin_mps: 0.03  # above 0.23 m/s drive is forced to 0
      overspeed_cut_timeout_s: 2.0    # lock if still above cap+soft after 2 s (was 1 s; 10-19 locks: model/battery drift, held wheel readings)
      overspeed_hard_mps: 0.40        # or above 0.40 m/s for 0.2 s (0.35 drive cap, ~0.5 m/s steady)
      overspeed_hard_persist_s: 0.2
      breakaway_ramp_per_s: 0.05     # start at the tested 0.35, rising to drive_max 0.38 after 0.6 s (low battery)
      breakaway_timeout_s: 2.5       # was 1.5: fixed 0.35 produced feedback at ~0.79 s; margin for a low battery
      max_restarts: 10               # was 3, 5, 8: loop runs restart after occasional turn stalls
      restart_merge_s: 2.0           # a stall restart that dips below 0.05 m/s again while pulling away
                                     # counted twice (10-19 18:20: 4 of 9 restarts)
      high_speed_drive_max: 0.35     # the drive cap at or above high_speed_mps (vehicle.drive_max below it)
      high_speed_mps: 0.12           # raw or filtered speed, whichever is larger (was 0.15)
      restart_count_reset_s: 10.0    # 10 s of tracking clears the count (long / loop runs)
      moving_speed_mps: 0.05         # unchanged: keep the existing tracking handover threshold
      drive_bias_max: 0.10           # was 0.05 (newcar27 layer); see vehicle.drive_deadband
      wheel_hold_stale_s: 0.5        # 2026-10-19 bags: held readings stalled the car in full-lock turns
                                     # (3 x ~3 s in nolimit-run2) and fed the overspeed locks; offline
                                     # replay flagged 10 stalls, all real (the reading then fell to 0)
      switch_hold_s: 0.25            # centerline jumps (e_psi to 1.2 rad) hold the last plan <= 0.25 s;
                                     # must stay below reference_dropout_tolerance_s (0.3 V2, 0.5 centerline)
      # 2026-10-19 night (docs/MPC_NEXT_PLAN_CN.md section 2; tools/car05_run_stats.py on the 10-19 bags).
      # Not yet run in Gym or on the car.
      turn_drive_per_steer: 0.06     # steady drive (|a| < 0.15) at 0.12-0.28 m/s: straight 0.28-0.30,
                                     # full lock 0.33-0.35 and mostly still slowing: ~0.05-0.07 more
      rest_speed_mps: 0.03           # tracking -> start only below 0.03 (start -> tracking stays at 0.05):
                                     # about half the restarts were dips below 0.05, not stalls
      handover_s: 0.5                # after start -> tracking, drive <= deadband + bias + turn + 0.04 for 0.5 s:
      handover_drive_margin: 0.04    # 48 of 65 handovers reached the soft/cut overspeed line within 2.5 s
      switch_blend_s: 0.4            # centerline -> lattice moved the steering by the QP's full step
      switch_steer_rate_per_s: 1.5   # (median 0.27-0.39); 0.075 per 0.05 s tick for 0.4 s after a switch
    control:
      max_run_time_s: 60.0           # was 30; the distance budget comes from make_deploy_yaml --distance
