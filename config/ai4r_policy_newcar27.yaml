# Overlay: car 10.43.254.27 as run on 2026-10-06 (MVP, B11/B12 settings).
# Values come from docs/experiments/2026-10-06/.../deployed-config.yaml. They are
# THIS car's field results (battery, ESC, camera on that day), not package defaults.
# Layer order: ai4r_policy.yaml -> this file -> an optional MPC overlay.
/**/ai4r_policy:
  ros__parameters:
    policy_update_mode: timer
    policy_update_rate_hz: 20.0
    required_sensors: [cone_detections, wheel_speed, imu_angular_velocity]
    estimation:
      motion_max_interval_s: 0.4      # camera acquisition-to-publish ~0.19-0.22 s
      min_cone_confidence: 0.75       # 0.85 lost coverage on the car (B14)
    planning:
      cruise_speed_mps: 0.2
      max_source_age_s: 0.4           # 0.2 rejected nearly every frame (stale_road)
      reference_lifetime_s: 0.2       # 0.1 expired under 20 Hz scheduling jitter
      max_near_x_m: 0.9
      min_forward_x_m: 1.0
      max_fit_error_m: 0.06
      max_curvature_1pm: 0.25         # fitted noise reached ~0.18 1/m on a straight
      max_heading_error_rad: 0.25
    control:
      enabled: true
      mode: mvp
      max_distance_m: 3.0
      max_run_time_s: 30.0
      mvp_lateral_kp: 1.5
      mvp_heading_kp: 1.0
      mvp_steering_direction: -1.0    # +0.4 request turned the wheels right
      mvp_drive_feedforward: 0.30     # sustains ~0.2 m/s; 0.26 decelerates
      speed_kp: 0.35
      speed_ki: 0.08
      drive_max: 0.35                 # 0.15/0.25 did not start the car
