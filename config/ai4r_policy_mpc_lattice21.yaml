# Overlay: the MVP2.1 lattice (origin/mvp2.1 3652e9b) feeding the MPC. Layer order:
#   ai4r_policy.yaml -> ai4r_policy_newcar27.yaml -> ai4r_policy_mpc_newcar27.yaml
#   -> ai4r_policy_mpc_centerline.yaml -> this file (-> ai4r_policy_mpc_car05.yaml)
# Build it with tools/make_deploy_yaml.py --mode mpc-shadow-lattice21; it is MPC SHADOW
# only (zero actions). road_centerline stays the 20 Hz baseline and the same-tick
# fallback; the lattice runs at 1 Hz in a separate low-priority process.
# Every field is startup-only: edit, rebuild and restart the policy.
/**/ai4r_policy:
  ros__parameters:
    # true: the MPC tracks the selected lattice path, aligned to the current body
    # frame each tick and cropped by travelled arc, when it passes the rolling
    # known-boundary and coverage checks; otherwise this tick's road_centerline
    # reference. Record /car/planner_execution and /car/mpc_debug
    # (reference_selection, reference_selection_reason) to see which was used.
    planner_control:
      enabled: true
      # Use the lattice only while road_centerline itself is valid. false is
      # mvp2.1's behaviour: the (deliberately permissive) lattice keeps driving
      # through baseline rejections. Keep true until shadow data says otherwise.
      require_valid_baseline: true

    # Values as shipped on origin/mvp2.1 (config/ai4r_policy.yaml there).
    shadow:
      enabled: true
      rate_hz: 1.0
      # Road snapshots are collected at the baseline tick rate; same-camera
      # epochs are deduplicated. Fusion runs in the shadow process only.
      fusion_enabled: true
      fusion_window_s: 1.0
      fusion_max_samples: 21
      fusion_spacing_m: 0.10
      fusion_memory_weight: 1.0
      fusion_rear_support_m: 0.30
      # fusion-prior-reset experiment (2026-10-28): false = never guide fusion with the
      # previous reference. Default true is the shipped behaviour.
      fusion_use_prior: true
      length_m: 1.0
      sample_count: 48
      path_spacing_m: 0.025
      # Hypothetical time before the next reference: 1/rate + handoff allowance.
      # Check distance uses actual |wheel speed|, not the advised cruise speed.
      handoff_allowance_s: 0.10
      # mpc-car-run addition (2026-10-20), not in mvp2.1. Planning-time collision check length:
      #   "travel": speed * hold, as above (mvp2.1's behaviour);
      #   "max": max(speed * hold, preview_m + 0.15), the execution check's window at planning time;
      #   "travel_plus_window": speed * hold + preview_m + 0.15, the execution window on every tick
      #   while the path is in use. Car 05 uses this (config/ai4r_policy_mpc_car05.yaml).
      # The execution check reads to preview_m + 0.15 past the car, so "travel" leaves ~0.3-0.5 m
      # unchecked and bends fall back to the centreline: docs/LATTICE_CHECK_LENGTH_PLAN_CN.md.
      check_length_mode: "travel"
      # mpc-car-run addition (2026-10-21, from the sim-integration branch), not in mvp2.1.
      # "prefix" (mvp2.1): collision-check / score the lengths above (score: max(score_min_length_m,
      # check length)). "generated": the whole generated path, max(length_m, score, check+preview_m),
      # about 1.07 m at 0.20 m/s with travel_plus_window (0.72 m with prefix).
      collision_coverage: "prefix"
      score_coverage: "prefix"
      score_min_length_m: 0.2
      search_half_width_m: 0.45
      preparation_width_fraction: 0.15
      # PROVISIONAL rectangle at CG, metres; replace with this car's measurements.
      # Width 0.30 follows the operator's car report; front/rear are assumptions.
      # No extra clearance. Only observed/observed_with_history boundaries count.
      body_front_m: 0.25
      body_rear_m: 0.25
      body_width_m: 0.30
      # Numerical sweep resolution, not additional padding or a physical guarantee.
      sweep_translation_step_m: 0.01
      sweep_rotation_step_rad: 0.025
      weight_lateral: 6.0
      weight_heading: 1.5
      weight_progress: 2.0
      weight_smoothness: 0.04
