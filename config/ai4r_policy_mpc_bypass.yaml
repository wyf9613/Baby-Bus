# Overlay: vehicle-model MPC on the estimator centerline, BYPASSING Planning (allows bends).
# Shadow mode by default. Planning's body-clearance and stopping-distance checks do not apply;
# executing (shadow: false) additionally requires mpc.bypass_acknowledged: true.
/**/ai4r_policy:
  ros__parameters:
    required_sensors: [cone_detections, wheel_speed, imu_angular_velocity]
    # The shipped file enables the MVP controller; exactly one controller may own the actions.
    control:
      enabled: false
    mpc:
      enabled: true
      shadow: true
      reference_source: estimation_centerline
      # Course notebook vehicle for the prediction (shadow only), as in the prototype overlay.
      vehicle_params_source: course_simulation
