# AI4R policy settings. This file is part of the student programming interface.
# Edit values under ros__parameters, then restart ONLY the policy node.
# Restarting returns to publishing-zero state; it does not enable the vehicle.
# The selector applies to the ai4r_policy node in any robot namespace.
/**/ai4r_policy:
  ros__parameters:
    # What causes ONE execution of your policy calculation?
    #   cone_detection: each accepted fresh cone-detection batch (default).
    #   fiducial_detection: each accepted fresh fiducial-detection batch.
    #   lidar:          each accepted fresh lidar scan.
    #   timer:          a timer at policy_update_rate_hz, using cached sensors.
    # Other callbacks only store observations. There is no automatic fallback
    # to timer mode if the chosen sensor stops, and no simultaneous triggers.
    policy_update_mode: cone_detection

    # Timer-mode frequency in Hz (positive finite double; default 50.0).
    # Ignored outside timer mode. More steps do NOT mean more sensor measurements.
    # Use the measured dt supplied to your policy, not 1/frequency.
    # Your action interval must leave margin below the VEHICLE command timeout
    # (normally 0.5 s); a very slow policy can cause the vehicle to disable.
    policy_update_rate_hz: 50.0

    # Which observations MUST be present and fresh before/during your policy?
    # Valid names: cone_detections, fiducial_detections, lidar_scan,
    #              lidar_cartesian, wheel_speed,
    #              imu_orientation, imu_angular_velocity, imu_specific_force.
    # Each IMU field is independent: a new gyro message is not a new heading.
    # Missing/stale REQUIRED data stops the policy in publishing-zero state.
    # Recovery needs another explicit state-3 request. Optional missing/expired
    # values are None in the student code (arrays have an availability flag).
    # cone_detection mode must require cone_detections; fiducial_detection mode
    # must require fiducial_detections; lidar mode must require lidar_scan,
    # lidar_cartesian, or both. lidar_scan requires the original radial scan;
    # lidar_cartesian also needs its successfully transformed body-frame points.
    # Conversion always runs: this list selects requirements, not processing.
    # The old sensor name lidar is now lidar_scan; the update mode stays lidar.
    # Timer mode may use [] for a deliberate open-loop experiment.
    required_sensors: [cone_detections]

    # COPYABLE EXERCISES: replace the active settings above; do not add a second
    # active copy of the same key. A sensor-driven mode needs no rate setting.
    # Lidar-only track using body-frame Cartesian points, with no cone detector:
    #   policy_update_mode: lidar
    #   required_sensors: [lidar_cartesian]
    # For a radial-only policy, use required_sensors: [lidar_scan]. A missing
    # mounting transform then does not prevent raw scans from reaching policy.
    # Wheel-speed-controller tuning, with no cone detector or lidar:
    #   policy_update_mode: timer
    #   policy_update_rate_hz: 50.0
    #   required_sensors: [wheel_speed]
    # Cone-following with heading and speed feedback:
    #   policy_update_mode: cone_detection
    #   required_sensors: [cone_detections, imu_orientation, wheel_speed]
    # ArUco marker observations, with no cone requirement:
    #   policy_update_mode: fiducial_detection
    #   required_sensors: [fiducial_detections]

    # Maximum accepted age of each sensor in seconds (positive finite doubles).
    # Defaults are 0.5 s. Expiry occurs at age >= the value. Smaller values stop
    # sooner but tolerate less scheduling/transport delay. Stamped data must be
    # fresh by BOTH receipt time and its ROS sample stamp. Wheel speed has no
    # header, so only receipt age is available. Optional expired data is withheld.
    # wheel_speed measures telemetry freshness, NOT time between encoder ticks;
    # it must still arrive when the car is standing still.
    sensor_timeout_s:
      cone_detections: 0.5
      fiducial_detections: 0.5
      # Rename any old lidar timeout to lidar_scan. Cartesian data must pass
      # BOTH deadlines and always match the latest accepted raw scan. A failed
      # conversion makes it unavailable immediately, without waiting for expiry.
      lidar_scan: 0.5
      lidar_cartesian: 0.5
      wheel_speed: 0.5
      imu_orientation: 0.5
      imu_angular_velocity: 0.5
      imu_specific_force: 0.5

    # How long can required cone data contain NO cones? Seconds, positive finite
    # double, default 1.0. A valid empty frame refreshes stream freshness above,
    # but not this timer. These are two different failure conditions.
    # At startup, at least one recent nonempty batch is required before driving.
    # Brief empty batches can reach your policy: always handle num_cones == 0.
    # Ignored when cone_detections is not in required_sensors.
    cone_empty_timeout_s: 1.0

    # Independent watchdog and zero-command cadence in Hz (positive double).
    # Default 20 Hz checks roughly every 0.05 s, subject to executor scheduling.
    # It runs in ALL modes, but never runs student code or repeats a cached
    # driving action. Keep the zero-command interval below the vehicle timeout.
    # A hung student calculation blocks this Python timer too; the separate
    # vehicle command watchdog remains essential. Pan holds its target on stop.
    supervision_rate_hz: 20.0

    # Periodic policy state/status publication, seconds, positive double.
    # Default 0.5 s (2 Hz), rounded up to a supervision tick. State transitions
    # are reported immediately. This does NOT control the policy calculation rate.
    status_period_s: 0.5

    # Tolerance for a ROS sample stamp slightly in the future, seconds, finite
    # and >= 0 (default 0.05). Larger offsets, zero stamps, stale stamps, and
    # repeated/older samples are rejected. This does not extend stale deadlines.
    timestamp_tolerance_s: 0.05

    # Coordinate frame expected for cone positions and used for transformed
    # fiducial poses, Cartesian lidar points and body-frame IMU
    # observations (nonempty, no leading slash/whitespace). Normally base_link:
    # +x forwards, +y left, +z up, with its origin at nominal ground directly
    # below the agreed vehicle CG. Cone z is a detected point's nominal height
    # above that ground plane, not cone total height. DREAM must configure the
    # detector consistently and supply IMU and lidar mounting TF. The fixed camera pose
    # does not compensate for terrain or vehicle pitch; physical panning
    # invalidates it until measured dynamic TF is available. Raw lidar remains
    # in its message frame with its existing origin. A ROS namespace does not
    # prefix a frame ID. Changing this string does not rotate or move a sensor.
    policy_frame_id: base_link

    # Live robot only. true is rejected; simulated-clock/bag playback operation
    # is not supported by this initial package or the live vehicle/IMU drivers.
    use_sim_time: false

    # Vehicle identification: startup-only, one sequence per explicit state-3 request.
    # Set policy_update_mode: timer and required_sensors: [wheel_speed] above.
    # Optional IMU remains per-field valid/fresh; require imu_angular_velocity
    # as well if the experiment needs yaw data. Record before requesting state 3.
    id_test:
      mode: "off"                   # off / steering / drive / brake (keep off quoted)
      confirmed: false              # review the sequence and limits on site first
      negative_drive_confirmed: false # brake mode only, after confirming ESC rules
      durations_s: [1.0]            # one duration per stage; all three arrays align
      drive_values: [0.0]           # normalized motor effort, NOT target speed
      steering_values: [0.0]        # normalized request, NOT wheel angle
      drive_min: 0.0               # reviewed working limits; no motion defaults
      drive_max: 0.0
      steering_abs_max: 0.0
      speed_limit_mps: 0.0         # must be > start_speed_max_mps for an active test
      start_speed_max_mps: 0.03    # measured unsigned speed threshold, not proof of rest
      settle_s: 2.0               # zeros before/after sequence, NOT active braking
      max_dt_s: 0.15              # larger scheduling gap aborts rather than skipping ahead
      max_run_s: 30.0             # includes both settle intervals; at most 120 s

    # ADD YOUR OWN PARAMETER: also declare and read it in policy_node.py.
    # Example for the commented controller in that file:
    # speed_kp: 0.2
    # Explain its units/range here. A YAML entry alone does not declare a ROS
    # parameter. Use 0.2/0.0 for doubles; integer 0 has a different ROS type.
