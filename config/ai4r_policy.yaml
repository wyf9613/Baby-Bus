# RNN planner + user MPC; target0.5; physical trial selected by operator.
/**/ai4r_policy:
  ros__parameters:
    policy_update_mode: timer
    policy_update_rate_hz: 20.0
    required_sensors:
    - cone_detections
    - wheel_speed
    - imu_angular_velocity
    sensor_timeout_s:
      cone_detections: 1.5
      fiducial_detections: 0.5
      lidar_scan: 0.5
      lidar_cartesian: 0.5
      wheel_speed: 0.5
      imu_orientation: 0.5
      imu_angular_velocity: 0.5
      imu_specific_force: 0.5
    cone_empty_timeout_s: 2.0
    supervision_rate_hz: 20.0
    status_period_s: 0.5
    timestamp_tolerance_s: 0.05
    policy_frame_id: base_link
    use_sim_time: false
    # 前方直线停车区 / Straight-ahead stop corridor, base_link metres.
    lidar_obstacle:
      enabled: true
      body_width_m: 0.25
      front_from_cg_m: 0.297
      side_margin_m: 0.02
      range_min_m: 0.2
      # 延续先前约定 / +inf means assumed no return, not measured free space.
      allow_no_return_clear: true
      stop_distance_m: 0.5
      cluster_gap_m: 0.06
      min_cluster_points: 2
      min_known_fraction: 0.7
    estimation:
      colour_assignment: fixed
      left_colour: 2
      right_colour: 1
      speed_tau_s: 0.15
      yaw_rate_tau_s: 0.08
      max_source_age_s: 1.5
      motion_max_gap_s: 0.25
      motion_max_interval_s: 0.5
      history_propagation: continuous
      continuous_road_output: true
      road_prediction_max_distance_m: 0.5
      history_merge_single_side: true
      history_merge_radius_m: 0.08
      road_history_mode: distance
      road_history_max_s: 30.0
      road_history_s: 5.0
      road_rear_support_m: 1.0
      road_hold_s: 0.8
      min_cone_confidence: 0.25
      road_forward_max_m: 4.0
      road_min_coverage_m: 0.3
      road_sample_spacing_m: 0.1
      road_max_gap_m: 2.0
      huber_delta_m: 0.2
      road_width_min_m: 0.15
      road_width_max_m: 2.5
      road_max_abs_slope: 3.0
      known_lane_width_m: 0.0
      single_side_from_learned_width: true
      single_side_offset_fraction: 0.6
      road_geometry: ordered_xy
      ordered_pairing_backtrack_m: 0.03
    planner_control:
      enabled: true
    learned_policy:
      enabled: true
      model_path: models/path_policy.json
      model_sha256: a3116bb7bc4bb46ccb6e208fa3de628eca940820810943409c3157e5b12aa66b
    shadow:
      enabled: true
      rate_hz: 1.0
      # Same minimum as execution preview 0.35 + tangent window 0.15.
      execution_min_check_m: 0.5
      width_aware_sampling_enabled: true
      # tan(0.3142 * 0.50) / 0.33 ~= 0.48 /m; original vehicle model.
      controller_max_curvature_1pm: 0.48
      collision_coverage: prefix
      score_coverage: prefix
      fusion_enabled: true
      fusion_window_s: 1.0
      fusion_max_samples: 21
      fusion_spacing_m: 0.1
      fusion_memory_weight: 1.0
      fusion_rear_support_m: 0.3
      # More overlap across 1 Hz planning + measured handoff latency.
      length_m: 1.4
      sample_count: 48
      path_spacing_m: 0.025
      handoff_allowance_s: 0.1
      score_min_length_m: 0.2
      search_half_width_m: 0.45
      unknown_width_reference_scale: 1.3333333333333333
      preparation_width_fraction: 0.15
      body_front_m: 0.297
      body_rear_m: 0.198
      body_width_m: 0.25
      sweep_translation_step_m: 0.01
      sweep_rotation_step_rad: 0.025
      weight_lateral: 6.0
      weight_heading: 1.5
      weight_progress: 2.0
      weight_smoothness: 0.04
    planning:
      algorithm: road_centerline
      cruise_speed_mps: 0.5
      preview_m: 0.35
      allow_forward_only: true
      max_source_age_s: 1.5
      reference_lifetime_s: 0.2
      max_sample_gap_m: 0.25
    control:
      enabled: true
      mode: mvp
      startup_grace_s: 8.5
      planner_startup_wait_s: 8.0
      reference_refresh_grace_s: 0.1
      gyro_fallback_enabled: false
      gyro_fallback_max_camera_age_s: 0.35
      gyro_fallback_speed_mps: 0.2
      robustness_enabled: false
      reference_hold_max_s: 1.0
      reference_hold_max_distance_m: 0.25
      vehicle_params_source: upstream
      max_distance_m: 0.0
      max_run_time_s: 0.0
      end_straight_distance_m: 0.0
      end_straight_drive_normalized: 0.3
      end_straight_max_time_s: 8.0
      mvp_lateral_kp: 2.5
      mvp_lateral_ki: 0.0
      mvp_heading_kp: 1.5
      mvp_ordered_cornering_enabled: true
      mvp_steering_direction: -1.0
      mvp_steering_slew_rate_per_s: 4.0
      mvp_error_filter_tau_s: 0.1
      mvp_drive_feedforward: 0.5
      speed_kp: 0.35
      speed_ki: 0.08
      speed_kd: 0.0
      lateral_kp: 1.2
      lateral_ki: 0.1
      lateral_kd: 0.0
      heading_kp: 0.8
      derivative_tau_s: 0.15
      drive_max: 0.5
      steering_max_normalized: 0.5
      max_dt_s: 0.2
    mpc:
      trial_fixed_drive: 0.0
      gym_trial_acknowledged: true
      enabled: true
      shadow: false
      vehicle_params_source: partial_vehicle
      v_exec_max_mps: 0.5
      overspeed_margin_mps: 0.1
      overspeed_stop_enabled: false
      reference_dropout_tolerance_s: 0.0
      moving_speed_mps: 0.05
      breakaway_timeout_s: 1.5
      breakaway_ramp_per_s: 0.0
      max_restarts: 3
      drive_bias_gain: 0.0
      drive_bias_max: 0.05
      dt_hard_max_s: 0.4
      # 0.6 s / 0.30 m at target speed; reduce per-tick work, retain 50 ms deadline.
      horizon_n: 6
      dt_pred_s: 0.1
      dt_max_s: 0.25
      sqp_iterations: 1
      q_ey: 20.0
      q_epsi: 5.0
      q_v: 10.0
      r_delta: 1.0
      r_ddelta: 2.0
      r_drive: 1.0
      r_ddrive: 2.0
      terminal_scale: 5.0
      start_bridge_enabled: true
      max_backward_extension_m: 1.2
      reference_spacing_m: 0.05
      max_step_time_s: 0.05
      solver_time_limit_s: 0.03
      solver_max_iter: 400
      constraint_tolerance: 0.0001
      qp_solver: dense
      reference_source: planning
      bypass_acknowledged: false
      bypass_target_speed_mps: 0.2
      bypass_max_curvature_1pm: 0.8
      bypass_max_fit_error_m: 0.04
      bypass_min_forward_m: 1.0
      bypass_fit_max_x_m: 1.5
      bypass_max_source_age_s: 0.2
      bypass_valid_for_s: 0.1
      trial_follow_planning: true
      speed_feedback_enabled: true
      reference_join_repair_enabled: true
      speed_feedback_measured_motion: true
      speed_feedback_continuous_enabled: true
      speed_feedback_drive_slew_per_s: 2.0
      speed_feedback_kp: 0.5
      speed_feedback_ki: 1.0
      speed_feedback_start_drive: 0.36
      speed_feedback_start_pulse_s: 0.5
      speed_feedback_drive_max: 0.36
      speed_feedback_sustain_drive: 0.3
      speed_feedback_accel_tau_s: 0.05
      speed_feedback_coast_margin_mps: 0.01
      adaptive_horizon_enabled: true
      adaptive_horizon_min_n: 2
      reference_end_margin_m: 0.02
      learned_planner_speed_match_enabled: true
    mpc_vehicle:
      valid: false
      source: newcar20_partial_identification_20261012
      wheelbase_m: 0.33
      rear_axle_from_cg_m: 0.132
      body_front_extent_from_cg_m: 0.297
      body_rear_extent_from_cg_m: 0.198
      body_width_m: 0.25
      steering_gain_rad: -0.3142
      steering_offset_rad: 0.0
      steering_min_rad: -0.3142
      steering_max_rad: 0.3142
      steering_rate_limit_rad_s: 1.21
      drive_min: -1.0
      drive_max: 1.0
      drive_response_model: 'MPC still uses assumed Gym force law. Measured FOPDT
        at u=0.4, not converted: Forward local FOPDT at drive_action=0.4: v(t)=0 for
        t<=0.26 s; v(t)=1.49*(1-exp(-(t-0.26)/1.33)) m/s for t>0.26 s. Flat surface,
        from rest; v_inf is extrapolated from three 3 s runs.'
      braking_behavior: 'course notebook: direction-change latch, NOT modelled; forward
        drive only'
      steering_delay_s: 0.03
      drive_delay_s: 0.26
      mass_kg: 3.0
      motor_gain_n: 10.0
      drag_kg_per_m: 1.0
      drive_deadband: 0.0
      brake_gain_n: 10.0
      drive_breakaway: 0.0
      breakaway_wait_s: 0.0
      speed_max_mps: 0.5
      braking_deceleration_mps2: 0.5
      safety_margin_m: 0.05
