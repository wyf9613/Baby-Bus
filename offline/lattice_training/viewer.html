<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lattice 路线评估</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#24304a;font:14px system-ui,"Microsoft YaHei",sans-serif}header{padding:20px 28px;background:#15223b;color:white}h1{margin:0 0 7px;font-size:22px}header p{margin:0;opacity:.8}main{display:grid;grid-template-columns:minmax(320px,1fr) 300px;gap:16px;padding:20px}.card{background:white;border:1px solid #dfe5ee;border-radius:12px;padding:16px}canvas{width:100%;height:66vh;display:block;background:#fafcff;cursor:crosshair}h2{font-size:17px;margin:0 0 14px}.row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}input[type=number]{width:85px;padding:7px;border:1px solid #ccd5e3;border-radius:6px}button,select{padding:8px 12px;border:1px solid #bbc7d9;border-radius:7px;background:white;color:#183253;cursor:pointer}button.primary{background:#245bba;color:white;border:0}.stat{padding:9px;background:#f3f6fb;border-radius:6px;line-height:1.6}.small{font-size:12px;color:#64758e}.list{max-height:36vh;overflow:auto}.candidate{padding:8px;margin-top:6px;border:1px solid #dee5ef;border-radius:6px;cursor:pointer;font-size:12px}.candidate:hover,.candidate.active{background:#eaf2ff}.rejected{border-left:3px solid #c7576a}.admitted{border-left:3px solid #428bb0}#message{white-space:pre-wrap;line-height:1.7}#speed{height:150px;cursor:default}.legend{display:flex;gap:15px;font-size:12px;color:#586c88;margin:12px 0}@media(max-width:700px){main{grid-template-columns:1fr}canvas{height:55vh}}</style>
<header><h1>Lattice 路线评估</h1><p>整条路线的 C* 实际执行轨迹 · 点击道路添加观察位置，查看该位置的候选路径</p></header>
<main><section class="card"><div class="row"><button id="fit">整条道路</button><button id="focus">查看选中位置</button><label><input type="checkbox" id="reject" checked>显示被拒绝路径</label><label><input type="checkbox" id="reference">显示选中的规划路径</label></div><canvas id="map"></canvas><div class="legend"><span>橙色：实际轨迹</span><span>蓝色：可选候选</span><span>绿色：分数最高</span><span>红虚线：已拒绝</span></div><canvas id="speed"></canvas></section>
<aside class="card"><h2>执行结果</h2><div id="stats" class="stat"></div><h2 style="margin-top:20px">添加位置</h2><div class="row"><label>道路进度 <input type="number" id="progress" min="0" step="0.1" value="1"> m</label><button class="primary" id="add">添加</button></div><div class="row"><label><input type="checkbox" id="traceState" checked>使用此位置的执行状态</label></div><div class="row"><label>速度 <input type="number" id="v" min="0" max="0.5" step="0.05" value="0.2"> m/s</label></div><div class="row"><label>横向偏移 <input type="number" id="offset" min="-0.4" max="0.4" step="0.05" value="0"> m</label><label>朝向偏差 <input type="number" id="heading" min="-0.5" max="0.5" step="0.05" value="0"> rad</label></div><div class="row"><select id="points"></select></div><div id="message" class="small"></div><div id="list" class="list"></div></aside></main>
<script type="application/json" id="report">__REPORT_JSON__</script><script>
const R=JSON.parse(document.getElementById('report').textContent),$=id=>document.getElementById(id),C=$('map'),ctx=C.getContext('2d');let panels=[...(R.inspection_panels||[])],selected=0,highlight=null,bounds,view;
function fit(){const p=[...R.scene.left,...R.scene.right];bounds=[Math.min(...p.map(x=>x[0]))-1,Math.max(...p.map(x=>x[0]))+1,Math.min(...p.map(x=>x[1]))-1,Math.max(...p.map(x=>x[1]))+1];view=[...bounds];draw()}
function setup(canvas){const box=canvas.getBoundingClientRect();canvas.width=Math.round(box.width*devicePixelRatio);canvas.height=Math.round(box.height*devicePixelRatio);return [canvas.width,canvas.height]}
function transform(){let [w,h]=setup(C),s=Math.min(w/(view[1]-view[0]),h/(view[3]-view[2]));return {w,h,s,x:(w-s*(view[1]-view[0]))/2,y:(h-s*(view[3]-view[2]))/2}}
function line(p,color,width=1,dash=[]){if(!p.length)return;const t=transformCache;ctx.beginPath();p.forEach((q,i)=>{const x=t.x+(q[0]-view[0])*t.s,y=t.h-t.y-(q[1]-view[2])*t.s;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=color;ctx.lineWidth=width*devicePixelRatio;ctx.setLineDash(dash.map(x=>x*devicePixelRatio));ctx.stroke();ctx.setLineDash([])}
let transformCache;function dot(p,color,r=5,label=''){let t=transformCache,x=t.x+(p[0]-view[0])*t.s,y=t.h-t.y-(p[1]-view[2])*t.s;ctx.beginPath();ctx.arc(x,y,r*devicePixelRatio,0,7);ctx.fillStyle=color;ctx.fill();if(label){ctx.font=`${12*devicePixelRatio}px system-ui`;ctx.fillText(label,x+8*devicePixelRatio,y-7*devicePixelRatio)}}
function draw(){transformCache=transform();const t=transformCache;ctx.clearRect(0,0,t.w,t.h);ctx.beginPath();const road=[...R.scene.left,...[...R.scene.right].reverse()];road.forEach((p,i)=>{let x=t.x+(p[0]-view[0])*t.s,y=t.h-t.y-(p[1]-view[2])*t.s;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='#e1e7ef';ctx.fill();line(R.scene.left,'#a2b5ca');line(R.scene.right,'#a2b5ca');line(R.scene.center,'#b6c3d2',.8,[7,5]);for(const o of R.scene.obstacles){ctx.beginPath();o.forEach((p,i)=>{const x=t.x+(p[0]-view[0])*t.s,y=t.h-t.y-(p[1]-view[2])*t.s;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='#eaa34c';ctx.fill();ctx.strokeStyle='#ab7026';ctx.stroke()}
if($('reference').checked)for(const s of R.segments)line(s.reference_points,'#6f9ad0',1,[3,3]);line(R.trace.map(p=>[p.x_m,p.y_m]),'#eb5a25',2);panels.forEach((p,i)=>dot(p.pose,'#8352a9',i===selected?6:4,String(i+1)));const panel=panels[selected];if(panel){for(const c of panel.candidates){if(!c.admitted&&!$('reject').checked)continue;line(c.points,c.candidate_id===highlight?'#142749':c.selected?'#168768':c.admitted?'#3789b5':'#c46775',c.candidate_id===highlight?3:c.selected?2:1,c.admitted?[]:[3,3])}dot(panel.pose,'#8352a9',6)}dot(R.initial_pose,'#263f60',5,'起点');speed()}
function speed(){const c=$('speed'),a=c.getContext('2d'),[w,h]=setup(c);a.clearRect(0,0,w,h);if(!R.trace.length)return;const t0=R.trace[0].timestamp_s,T=Math.max(1,R.trace.at(-1).timestamp_s-t0),V=Math.max(.3,...R.trace.map(p=>p.speed_mps));a.strokeStyle='#eb5a25';a.lineWidth=2*devicePixelRatio;a.beginPath();R.trace.forEach((p,i)=>{let x=35*devicePixelRatio+(w-55*devicePixelRatio)*(p.timestamp_s-t0)/T,y=h-25*devicePixelRatio-(h-45*devicePixelRatio)*p.speed_mps/V;i?a.lineTo(x,y):a.moveTo(x,y)});a.stroke();a.fillStyle='#657893';a.font=`${11*devicePixelRatio}px system-ui`;a.fillText(`速度 (m/s)  最高 ${V.toFixed(2)} · 仿真时间 ${T.toFixed(1)}s`,15*devicePixelRatio,14*devicePixelRatio)}
function refresh(){const select=$('points');select.replaceChildren();panels.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`位置 ${i+1} · ${p.progress_m.toFixed(2)}m`;select.append(o)});select.value=selected;const p=panels[selected];$('list').replaceChildren();if(p){if(p.state&&$('traceState').checked){$('v').value=p.state.speed_mps.toFixed(3);$('offset').value=p.state.lateral_offset_m.toFixed(3);$('heading').value=p.state.heading_error_rad.toFixed(3)}$('message').textContent=`${p.state?'速度 '+p.state.speed_mps.toFixed(2)+'m/s · '+(p.state_source==='executed_trace'?'实际执行状态':'指定位置初态')+'\n':''}${p.admitted_count} 条可选候选，${p.rejected_count} 条被拒绝。${p.valid?'': '\n当前无法规划：'+p.reason}`;for(const c of p.candidates){let row=document.createElement('div');row.className='candidate '+(c.admitted?'admitted':'rejected');const d=c.descriptor;row.textContent=`${c.selected?'★ ':''}偏移 ${Number(d.offset_m).toFixed(2)}m · 过渡 ${Number(d.length_m).toFixed(1)}m${d.terminal_speed_mps!=null?' · 终速 '+d.terminal_speed_mps.toFixed(2)+'m/s':''}\n${c.admitted?'分数 '+c.score.toFixed(4)+' · 完整时域 '+c.full_path_duration_s.toFixed(1)+'s':'拒绝：'+c.reason}`;row.style.whiteSpace='pre-wrap';row.onclick=()=>{highlight=c.candidate_id;document.querySelectorAll('.candidate').forEach(x=>x.classList.remove('active'));row.classList.add('active');draw()};$('list').append(row)}}draw()}
async function add(p){$('message').textContent='正在获取该位置的候选…';try{if(location.protocol==='file:'){const nearby=[...(R.candidate_panels||[]),...panels].sort((a,b)=>Math.abs(a.progress_m-p)-Math.abs(b.progress_m-p))[0];if(!nearby)throw Error('没有记录的候选位置');panels.push(nearby);$('message').textContent='已选择最近的记录位置。'}else{const reply=await fetch('/candidates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({progress_m:p,speed:+$('v').value,offset:+$('offset').value,heading:+$('heading').value,use_trace:$('traceState').checked})});if(!reply.ok)throw Error('该位置的状态无法生成候选');panels.push(await reply.json())}selected=panels.length-1;highlight=null;refresh()}catch(e){$('message').textContent=e.message}}
$('stats').textContent=`${R.road_completed?'已到达道路终点':R.completion==='planned_stop_reference_complete'?'规划器选择停车，路线未完成':'路线未完成'}\n进度 ${R.final_progress_m.toFixed(2)} / ${R.road_length_m.toFixed(2)}m\n${R.steps} 个实际模拟步 · ${R.segments.length} 段\n${R.selector==='learned'?'Policy 评分':'Lattice 规则评分'}最高候选${R.fault?'\n中断原因：'+R.fault:''}`;$('stats').style.whiteSpace='pre-wrap';$('progress').max=R.road_length_m;
$('fit').onclick=fit;$('focus').onclick=()=>{if(panels[selected]){const p=panels[selected];const q=[p.pose,...p.candidates.flatMap(c=>c.points)];view=[Math.min(...q.map(x=>x[0]))-.5,Math.max(...q.map(x=>x[0]))+.5,Math.min(...q.map(x=>x[1]))-.5,Math.max(...q.map(x=>x[1]))+.5];draw()}};$('reject').onchange=draw;$('reference').onchange=draw;$('points').onchange=()=>{selected=+$('points').value;highlight=null;refresh()};$('add').onclick=()=>add(+$('progress').value);
C.onclick=e=>{let t=transformCache,box=C.getBoundingClientRect(),x=(e.clientX-box.left)*devicePixelRatio,y=(e.clientY-box.top)*devicePixelRatio,wx=view[0]+(x-t.x)/t.s,wy=view[2]+(t.h-t.y-y)/t.s;let best=0;R.scene.center.forEach((p,i)=>{if(Math.hypot(p[0]-wx,p[1]-wy)<Math.hypot(R.scene.center[best][0]-wx,R.scene.center[best][1]-wy))best=i});const p=R.scene.progression[best];$('progress').value=p.toFixed(2);add(p)};function stateMode(){for(const id of ['v','offset','heading'])$(id).disabled=$('traceState').checked} $('traceState').onchange=stateMode;stateMode();window.onresize=draw;fit();refresh();
</script></html>
